<div class="secondbg">
    <app-loggedinnavbar></app-loggedinnavbar>

    <div class="container-fluid communityContent">
        <div class="row" *ngFor="let post of (showAllPosts ? postList : postList.slice(0, 5))">
            <div class="col-xl-3 col-lg-3 col-md-12 col-sm-12 col-xs-12 user">
                <img [src]="'data:image/jpg;base64,' + post.profilePic" alt="user">
                <p>
                    {{ post.username }}
                </p>
            </div>
            <div class="col-xl-9 col-lg-9 col-md-12 col-sm-12 col-xs-12 text">
                <h1>{{ post.title }}</h1><br>
                <p>
                    {{ post.content }}
                </p>
                <img *ngIf="post.image" [src]="post.image" alt="picture">
                <a href="/logged-in-community">
                    Show Comments
                </a>
            </div>
            <hr>
        </div>

        <div class="container-fluid" id="create">
            <div class="row">
                <div class="create-post-container">
                    <button id="showMore" class="show-more-btn" (click)="togglePosts()">
                        {{ showAllPosts ? 'Show Less' : 'Show More' }}
                    </button>
                    <button id="createPost" class="create-post-btn" (click)="openCreatePostModal()">
                        Create Post
                    </button>
                </div>
                <div class="modal" *ngIf="showModal">
                    <div class="modal-content">
                        <span class="close" (click)="closeCreatePostModal()">&times;</span>
                        <h2>Create a New Post</h2>
                        <form (ngSubmit)="submitPost()">
                            <label for="title">Title:</label>
                            <input type="text" id="title" [(ngModel)]="newPost.title" name="title" required>
    
                            <label for="category">Category:</label>
                            <select id="category" [(ngModel)]="newPost.categoryId" name="category" required>
                                <option *ngFor="let category of categories" [value]="category.id">
                                    {{ category.category }}
                                </option>
                            </select>
    
                            <label for="content">Content:</label>
                            <textarea id="content" [(ngModel)]="newPost.content" name="content" required></textarea>
    
                            <button type="submit" [disabled]="!isFormValid()" id="submit">Submit</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <app-footer></app-footer>
</div>
