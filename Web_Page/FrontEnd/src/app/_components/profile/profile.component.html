<div class="secondbg">
    <app-loggedinnavbar></app-loggedinnavbar>
    <div class="container-fluid">
        <div class="row">
            <div class="col-12">
                <form action="">
                    <h1>Profile information</h1>
                    <div class="input-group">
                        <label for="username">Username</label>
                        <div class="edit">
                            <input type="text" [(ngModel)]="newUsername" name="username" placeholder="FOFAdmin" id="username" autofocus>
                        </div>
                        <div class="error"></div>
                    </div>
                    <div class="input-group">
                        <label for="email">E-mail</label>
                        <div class="edit">
                            <input type="email" [(ngModel)]="newEmail" name="email" placeholder="example@gmail.com" id="email">
                        </div>
                        <div class="error"></div>
                    </div>
                    <div class="input-group">
                        <label for="password">Password</label>
                        <div class="edit">
                            <input type="password" [(ngModel)]="newPassword" name="password" placeholder="*********" id="password">
                        </div>
                        <div class="error"></div>
                    </div>
                    <div class="input-group profPic">
                        <div class="edit">
                            <img [src]="'data:image/jpg;base64,' + profilePic" alt="profile_pic" *ngIf="profilePic">
                            <input type="file" accept="image/png, image/jpg, image/jpeg, image/jfif, image/webp" id="image" (change)="onFileSelected($event)" style="display: none;" />
                        </div>
                        <label for="image" class="file-upload-label">
                            <i class="bi bi-upload"></i>
                            <span class="tooltip-text">Fájl kiválasztása</span>
                        </label>
                    </div>
                    <div class="error">{{errorMessage}}</div>
                    <div class="buttons">
                        <button type="button" id="logout" (click)="onLogout()">Logout</button>
                        <button type="button" [disabled]="!isSaveEnabled()" id="save" (click)="saveChanges()">Save</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
    <app-footer></app-footer>
</div>
